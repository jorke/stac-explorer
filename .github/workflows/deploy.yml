name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - uses: actions/configure-pages@v6

      - run: npm ci

      - run: npm test

      - name: Build site
        env:
          VITE_ALS_API_KEY: ${{ secrets.VITE_ALS_API_KEY }}
          VITE_ALS_REGION: ${{ vars.VITE_ALS_REGION }}
        run: npm run build -- --base=/stac-explorer/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v5
